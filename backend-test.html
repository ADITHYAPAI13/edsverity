
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdsVerity Backend Test</title>
</head>
<body>
  <h2>Optional Edge Function diagnostic</h2>
  <p>This checks only the source-only health function, not database access or the optional Flask backend.</p>
  <p id="result" role="status">Connecting...</p>

  <script>
    fetch("https://ixrvjjarpexyhzmqntjb.supabase.co/functions/v1/edsverity-api", {
      method: "GET"
    })
    .then(response => {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById("result").textContent =
        data.status === 'online' ? 'Edge Function responded: online. Database access is not checked.' : 'Unexpected health response.';
    })
    .catch(error => {
      document.getElementById("result").textContent =
        "Connection failed: " + error.message;
    });
  </script>
</body>
</html>
